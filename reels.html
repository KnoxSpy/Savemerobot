<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000;
            --surface: rgba(18, 18, 22, 0.86);
            --surface-2: rgba(255, 255, 255, 0.06);
            --line: rgba(255, 255, 255, 0.10);
            --line-strong: rgba(255, 255, 255, 0.18);
            --text: #fff;
            --text-dim: rgba(255, 255, 255, 0.62);
            --accent: #25f4ee;
            --accent-2: #fe2c55;
            --link: #5aa9ff;
            --ok: #34d399;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --t-fast: 160ms;
            --t-med: 280ms;
            --t-slow: 480ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            user-select: none; -webkit-user-select: none;
        }

        button { font-family: inherit; }
        button:focus-visible, .uploader-info:focus-visible, .own-profile-chip:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        /* ===================== Loader ===================== */
        #app-loader {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 26px;
            transition: opacity var(--t-slow) var(--ease-out), visibility var(--t-slow);
        }
        #app-loader::before {
            content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%;
            background: radial-gradient(circle, rgba(254,44,85,0.28), transparent 65%);
            filter: blur(30px); animation: breathe 3.2s ease-in-out infinite;
        }
        #app-loader::after {
            content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; transform: translate(60px, 50px);
            background: radial-gradient(circle, rgba(37,244,238,0.22), transparent 65%);
            filter: blur(34px); animation: breathe 3.2s ease-in-out 1.2s infinite;
        }
        @keyframes breathe { 0%,100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }

        .loader-ring { position: relative; width: 96px; height: 96px; display: grid; place-items: center; z-index: 1; }
        .loader-ring::before {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid var(--line);
            border-top-color: var(--accent); border-right-color: var(--accent-2);
            animation: spin 1.1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tiktok-style-logo { width: 46px; height: 46px; animation: logoPulse 1.8s ease-in-out infinite; }
        @keyframes logoPulse { 0%,100% { transform: scale(0.94); } 50% { transform: scale(1.04); } }

        .loader-text {
            z-index: 1; font-size: 13px; color: var(--text-dim); letter-spacing: 0.4px; font-weight: 500;
            animation: fadePulse 1.8s ease-in-out infinite;
        }
        @keyframes fadePulse { 50% { opacity: 0.45; } }

        /* ===================== Top bar: own profile ===================== */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; min-height: 64px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
            display: flex; justify-content: flex-end; align-items: center;
            padding: var(--tg-safe-top, 0px) 14px 0 14px; z-index: 100; pointer-events: none;
            animation: dropIn var(--t-slow) var(--ease-out) 0.15s both;
        }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

        .own-profile-chip {
            display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer;
            padding: 4px 6px 4px 4px; border-radius: 999px;
            background: rgba(0,0,0,0.28); border: 1px solid var(--line);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            transition: transform var(--t-fast) var(--ease-out), background var(--t-fast) ease;
        }
        .own-profile-chip:active { transform: scale(0.96); background: rgba(0,0,0,0.45); }

        .own-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #1b1b1e; border: 1.5px solid rgba(255,255,255,0.9); }
        .own-name { font-size: 13px; font-weight: 600; color: #fff; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .own-settings-icon {
            width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2);
            display: flex; align-items: center; justify-content: center;
            transition: transform var(--t-med) var(--ease-spring), background var(--t-fast) ease;
        }
        .own-settings-icon:active { transform: rotate(60deg) scale(0.9); background: rgba(255,255,255,0.2); }
        .own-settings-icon svg { width: 13px; height: 13px; fill: #fff; }

        /* ===================== Feed ===================== */
        .reels-container {
            height: 100%; width: 100%; overflow-y: scroll; overflow-x: hidden;
            scroll-snap-type: y mandatory; scroll-behavior: auto; -webkit-overflow-scrolling: touch;
            transform: translate3d(0,0,0); will-change: scroll-position; -ms-overflow-style: none; scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel {
            position: relative; height: 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always;
            display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden;
        }

        .vignette-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.82) 100%);
        }

        video {
            width: 100%; height: 100%; object-fit: contain; object-position: center center; margin: auto;
            opacity: 0; transform: scale(1); transform-origin: center center; touch-action: pan-y; background-color: #000;
            transition: opacity var(--t-slow) var(--ease-out);
        }
        video.loaded { opacity: 1; }

        .play-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.7);
            background: rgba(0,0,0,0.5); border: 1px solid var(--line); border-radius: 50%;
            width: 76px; height: 76px; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 8;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: opacity var(--t-med) var(--ease-out), transform var(--t-med) var(--ease-spring);
        }
        .play-indicator.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Bottom progress line (fed by timeupdate) */
        .reel-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.14); z-index: 9; pointer-events: none; }
        .reel-progress i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

        /* ===================== Overlay ===================== */
        .overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 80px 16px 30px 16px;
            display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 5;
        }
        .overlay > * { animation: rise var(--t-slow) var(--ease-out) 0.1s both; }
        .overlay .actions-panel { animation-delay: 0.18s; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .video-details { max-width: 68%; color: #fff; pointer-events: auto; display: flex; flex-direction: column; gap: 10px; }

        .uploader-info {
            display: flex; align-items: center; gap: 10px; cursor: pointer; width: fit-content; padding: 4px 12px 4px 4px;
            border-radius: 999px; background: rgba(0,0,0,0.28); border: 1px solid var(--line);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: transform var(--t-fast) var(--ease-out), background var(--t-fast) ease;
        }
        .uploader-info:active { transform: scale(0.97); background: rgba(0,0,0,0.45); }
        .uploader-info img { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.9); object-fit: cover; background: #1b1b1e; }
        .uploader-info h3 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

        .video-details p {
            font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.94); text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            max-height: 90px; overflow-y: auto; scrollbar-width: none;
        }
        .video-details p::-webkit-scrollbar { display: none; }
        .caption-link { color: var(--link); text-decoration: none; font-weight: 700; pointer-events: auto; }

        /* ===================== Actions ===================== */
        .actions-panel { display: flex; flex-direction: column; gap: 14px; align-items: center; pointer-events: auto; margin-bottom: 4px; }

        .action-button {
            background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
            font-size: 11px; font-weight: 600; min-width: 44px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            transition: transform var(--t-fast) var(--ease-out);
        }
        .action-button:active { transform: scale(0.9); }

        .action-icon {
            width: 44px; height: 44px; background: rgba(255,255,255,0.10); border: 1px solid var(--line); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-bottom: 5px;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            transition: background var(--t-med) var(--ease-out), border-color var(--t-med) ease, transform var(--t-med) var(--ease-spring), box-shadow var(--t-med) ease;
        }
        .action-icon svg { width: 20px; height: 20px; fill: currentColor; }
        .action-icon.accent { background: rgba(37,244,238,0.14); color: var(--accent); border-color: rgba(37,244,238,0.30); }
        .action-label-accent { color: var(--accent); }

        .action-button.liked .action-icon { background: var(--accent-2); border-color: var(--accent-2); box-shadow: 0 6px 22px rgba(254,44,85,0.5); }
        .action-button.liked .action-icon svg { animation: heartBump 0.5s var(--ease-spring); }
        @keyframes heartBump { 0% { transform: scale(0.6); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .action-button.refresh:active .action-icon svg { transform: rotate(180deg); }
        .action-button.refresh .action-icon svg { transition: transform var(--t-slow) var(--ease-out); }

        .uploader-panel-pic-wrapper { position: relative; width: 46px; height: 46px; margin-bottom: 4px; cursor: pointer; }
        .uploader-panel-pic { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(45deg, var(--accent), var(--accent-2)); padding: 2px; }
        .uploader-panel-pic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1.5px solid #000; background: #1b1b1e; }

        .verified-badge { position: absolute; bottom: -1px; right: -1px; width: 15px; height: 15px; background: #1da1f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #000; color: #fff; }
        .verified-badge svg { width: 9px; height: 9px; }

        .heart-pop { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: var(--accent-2); filter: drop-shadow(0 0 22px rgba(254,44,85,0.85)); pointer-events: none; z-index: 10; }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-18deg); opacity: 0; }
            18% { transform: translate(-50%, -50%) scale(1.25) rotate(8deg); opacity: 1; }
            34% { transform: translate(-50%, -50%) scale(0.92) rotate(-4deg); opacity: 1; }
            55% { transform: translate(-50%, -50%) scale(1.04) rotate(0deg); opacity: 0.95; }
            100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
        }
        .pop-active { animation: heartPop 0.8s var(--ease-out) forwards; }

        .loading {
            position: absolute; color: var(--text-dim); font-size: 13px; font-weight: 500; letter-spacing: 0.4px; z-index: 3;
            animation: fadePulse 1.6s ease-in-out infinite;
        }

        /* ===================== Bottom sheets ===================== */
        .bottom-sheet { position: fixed; inset: 0; z-index: 1000; visibility: hidden; transition: visibility var(--t-med); }
        .bottom-sheet.open { visibility: visible; }

        .sheet-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.66); opacity: 0;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity var(--t-med) ease;
        }
        .bottom-sheet.open .sheet-overlay { opacity: 1; }

        .sheet-content {
            position: absolute; bottom: 0; left: 0; width: 100%; background: var(--surface);
            backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border-top-left-radius: 28px; border-top-right-radius: 28px; border-top: 1px solid var(--line);
            transform: translateY(100%); transition: transform var(--t-slow) var(--ease-out);
            padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; color: #fff;
            box-shadow: 0 -16px 40px rgba(0,0,0,0.5); touch-action: none;
        }
        .sheet-content.dragging { transition: none; }
        .bottom-sheet.open .sheet-content { transform: translateY(0); }

        .sheet-header { display: flex; justify-content: center; padding: 8px 0 14px; cursor: grab; }
        .sheet-drag-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.22); border-radius: 10px; }

        /* Stagger children in when a sheet opens */
        .bottom-sheet .profile-popup-info, .bottom-sheet .settings-list, .bottom-sheet .dual-action-row, .bottom-sheet .video-info-block { opacity: 0; transform: translateY(12px); transition: opacity var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out); }
        .bottom-sheet.open .profile-popup-info, .bottom-sheet.open .settings-list, .bottom-sheet.open .dual-action-row, .bottom-sheet.open .video-info-block { opacity: 1; transform: translateY(0); }
        .bottom-sheet.open .profile-popup-info { transition-delay: 0.10s; }
        .bottom-sheet.open .settings-list, .bottom-sheet.open .dual-action-row { transition-delay: 0.16s; }
        .bottom-sheet.open .video-info-block { transition-delay: 0.22s; }

        .profile-popup-info { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 22px; }
        .profile-popup-info img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--line-strong); object-fit: cover; background: #1b1b1e; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .profile-popup-info h4 { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; display: flex; align-items: center; gap: 6px; }

        .settings-list { display: flex; flex-direction: column; gap: 10px; }
        .setting-item {
            display: flex; justify-content: space-between; align-items: center; min-height: 52px;
            background: var(--surface-2); border: 1px solid var(--line); padding: 12px 16px; border-radius: 16px; font-size: 14px; font-weight: 500;
        }

        .switch { position: relative; display: inline-block; width: 46px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(255,255,255,0.16); transition: background-color var(--t-med) var(--ease-out); border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: #fff; transition: transform var(--t-med) var(--ease-spring); border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
        input:checked + .slider { background-color: var(--ok); }
        input:checked + .slider:before { transform: translateX(18px); }
        input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

        .uploader-avatar-wrap { position: relative; width: 88px; height: 88px; }
        .uploader-avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--line-strong); object-fit: cover; box-shadow: 0 10px 28px rgba(0,0,0,0.55); background: #1b1b1e; }
        .verified-badge-lg { position: absolute; bottom: 0; right: 0; width: 24px; height: 24px; background: #1da1f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #121216; }
        .verified-badge-lg svg { width: 11px; height: 11px; fill: #fff; }
        .inline-verified-badge { width: 16px; height: 16px; background: #1da1f2; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .inline-verified-badge svg { width: 9px; height: 9px; fill: #fff; }

        .open-chat-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border: none; outline-offset: 3px; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #3b82f6); color: #04121a; font-weight: 700; font-size: 14px; border-radius: 16px; padding: 13px;
            box-shadow: 0 8px 22px rgba(37,244,238,0.22);
            transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) ease;
        }
        .open-chat-btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(37,244,238,0.2); }
        .open-chat-btn svg { width: 17px; height: 17px; fill: currentColor; }

        .dual-action-row { display: flex; gap: 10px; margin-bottom: 18px; }
        .dual-action-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 64px;
            border: 1px solid var(--line); background: var(--surface-2); color: #fff; cursor: pointer; border-radius: 16px; padding: 12px 8px; font-size: 12.5px; font-weight: 600;
            transition: transform var(--t-fast) var(--ease-out), background var(--t-med) ease, border-color var(--t-med) ease;
        }
        .dual-action-btn:active { transform: scale(0.96); }
        .dual-action-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .dual-action-btn.save-btn { color: var(--accent); }
        .dual-action-btn.save-btn.active { background: rgba(37,244,238,0.14); border-color: rgba(37,244,238,0.4); }
        .dual-action-btn.save-btn.active svg { animation: heartBump 0.45s var(--ease-spring); }
        .dual-action-btn.report-btn { color: var(--accent-2); }
        .dual-action-btn.report-btn:active { background: rgba(254,44,85,0.14); border-color: rgba(254,44,85,0.35); }

        .video-info-block { display: flex; flex-direction: column; gap: 8px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: 1px solid var(--line); padding: 13px 16px; border-radius: 14px; font-size: 13px; }
        .info-label { color: var(--text-dim); font-weight: 500; }
        .info-value { color: #fff; font-weight: 600; }

        /* ===================== Toast ===================== */
        #custom-toast {
            position: fixed; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.96); background: rgba(24,24,28,0.92); color: #fff;
            padding: 12px 22px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 10000;
            display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none;
            transition: transform var(--t-med) var(--ease-spring), opacity var(--t-med) ease;
            border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 14px 34px rgba(0,0,0,0.55);
        }
    </style>
</head>
<body>

    <!-- Animated Loader Screen -->
    <div id="app-loader">
        <div class="loader-ring"><svg class="tiktok-style-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.589 12.55c-1.8 0-3.45-.69-4.7-1.83V17c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6c.3 0 .59.03.88.08V13.2c-.29-.07-.58-.1-.88-.1-2.15 0-3.9 1.75-3.9 3.9s1.75 3.9 3.9 3.9 3.9-1.75 3.9-3.9v-13h2.12c.38 2.61 2.63 4.65 5.37 4.65V6.45c-1.42 0-2.63-.84-3.2-2.05H14.19v9.12c1.07.65 2.33 1.03 3.69 1.03h1.71v-2h-1.71z" fill="#00f2fe"/>
            <path d="M19.589 11.55c-1.8 0-3.45-.69-4.7-1.83V16c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6c.3 0 .59.03.88.08V12.2c-.29-.07-.58-.1-.88-.1-2.15 0-3.9 1.75-3.9 3.9s1.75 3.9 3.9 3.9 3.9-1.75 3.9-3.9v-13h2.12c.38 2.61 2.63 4.65 5.37 4.65V5.45c-1.42 0-2.63-.84-3.2-2.05H14.19v9.12c1.07.65 2.33 1.03 3.69 1.03h1.71v-2h-1.71z" fill="#fe0979" style="mix-blend-mode: screen;"/>
        </svg></div>
        <div class="loader-text" id="loaderText">Loading Videos...</div>
    </div>

    <!-- Slim top bar: own profile chip only (no solid panel) -->
    <div class="top-bar">
        <div class="own-profile-chip" onclick="openProfileModal(currentUser.id, currentUser.username, currentUser.photo)">
            <img class="own-avatar" id="ownAvatarImg" src="" alt="" onerror="handleImgError(this)">
            <span class="own-name" id="ownNameText"></span>
            <span class="own-settings-icon" onclick="event.stopPropagation(); openProfileModal(currentUser.id, currentUser.username, currentUser.photo)">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 c-0.12,0.21-0.08,0.47,0.12,0.61l2.03,1.58C4.84,11.36,4.81,11.68,4.81,12c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>

    <!-- Container for dynamic reels -->

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();

            // Always open in Telegram's full-screen mode, no matter which
            // link/entry point was used to launch the Mini App.
            try {
                if (typeof tg.requestFullscreen === 'function') {
                    tg.requestFullscreen();
                }
            } catch (e) {
                console.log('Fullscreen not supported on this client', e);
            }

            // Ask for confirmation instead of closing instantly when the
            // user presses the phone's back button / swipes to close.
            if (typeof tg.enableClosingConfirmation === 'function') {
                tg.enableClosingConfirmation();
            }
        }

        // Keep our own top-bar below Telegram's own fullscreen chrome
        // (back / close / menu icons), which reserve a safe area on some
        // clients. This never affects layout when there is no such inset.
        function applyTelegramSafeArea() {
            if (!tg) return;
            const top = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top)
                || (tg.safeAreaInset && tg.safeAreaInset.top)
                || 0;
            document.documentElement.style.setProperty('--tg-safe-top', `${top}px`);
        }
        if (tg) {
            applyTelegramSafeArea();
            if (typeof tg.onEvent === 'function') {
                tg.onEvent('safeAreaChanged', applyTelegramSafeArea);
                tg.onEvent('contentSafeAreaChanged', applyTelegramSafeArea);
                tg.onEvent('fullscreenChanged', applyTelegramSafeArea);
            }
        }

        // Fallback avatar shown whenever a profile photo fails to load
        // (old videos whose uploaderPic link has expired / broken, etc).
        const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
            '<circle cx="32" cy="32" r="32" fill="#26262b"/>' +
            '<circle cx="32" cy="25" r="12" fill="#5c5c66"/>' +
            '<path d="M8 58c0-14 10.7-24 24-24s24 10 24 24" fill="#5c5c66"/>' +
            '</svg>'
        );

        function handleImgError(img) {
            img.onerror = null;
            img.src = DEFAULT_AVATAR;
        }

        // Central place to resolve a profile photo URL.
        // Profile photos are expected to already be ImgBB URLs (uploaded by
        // the backend -- see the separate upload helper). The frontend just
        // displays whatever URL it is given and falls back to a default
        // avatar if it's missing or fails to load.
        function resolvePhotoUrl(rawUrl) {
            if (!rawUrl || rawUrl.includes('via.placeholder.com')) return DEFAULT_AVATAR;
            return rawUrl;
        }

        // Resolve the Telegram user. Order: initDataUnsafe -> raw initData in the
        // URL hash -> ?uid= added by the bot's keyboard button. Keyboard-button
        // launches sometimes arrive without a user, which showed "Guest_User".
        function resolveTelegramUser() {
            let u = tg?.initDataUnsafe?.user;
            if (u && u.id) return u;
            try {
                const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
                const raw = hash.get('tgWebAppData') || tg?.initData;
                if (raw) {
                    const parsed = JSON.parse(new URLSearchParams(raw).get('user') || 'null');
                    if (parsed && parsed.id) return parsed;
                }
            } catch (e) {}
            try {
                const uid = new URLSearchParams(window.location.search).get('uid');
                if (uid && /^\d+$/.test(uid)) return { id: Number(uid), fromUrl: true };
            } catch (e) {}
            return null;
        }
        const tgUser = resolveTelegramUser();
        const currentUser = {
            id: tgUser?.id || "demo_user_123",
            username: tgUser?.username || [tgUser?.first_name, tgUser?.last_name].filter(Boolean).join(' ') || (tgUser?.fromUrl ? "" : "Guest_User"),
            photo: resolvePhotoUrl(tgUser?.photo_url)
        };

        // When only the id is known, load the name and photo from the server.
        async function loadOwnProfileFromServer() {
            if (!tgUser || tgUser.username || tgUser.first_name) return;
            try {
                const r = await fetch(`/api/user/profile?userId=${currentUser.id}`);
                const d = await r.json();
                if (d && d.success) {
                    currentUser.username = d.username || String(currentUser.id);
                    if (d.photo) currentUser.photo = d.photo;
                    applyOwnProfileChip();
                }
            } catch (e) {}
        }

        let videos = [];
        let appLang = "en";
        let activeIndex = 0;
        const container = document.getElementById('reelsContainer');

        // Verified / official accounts
        function isOfficialAccount(uploaderName, uploaderId) {
            const n = (uploaderName || '').toLowerCase();
            return n.includes('reelsuploder') || n.includes('reelsuploader') ||
                   uploaderId === 'reelsuploder' || uploaderId === '-1002241516027';
        }
        function isVerifiedAccount(uploaderName, uploaderId) {
            const n = (uploaderName || '').toLowerCase().replace('@', '');
            return isOfficialAccount(uploaderName, uploaderId) || n === 'spy_ofc';
        }
        function verifiedBadgeSvg() {
            return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 20 8l-1.4-1.4z"/></svg>';
        }

        const uiStrings = {
            en: {
                save: "Save Video",
                saved: "Saved",
                refresh: "Refresh",
                report: "Report Video",
                no_caption: "No caption provided.",
                loading: "Loading...",
                upload_reels: "Reels Upload Syncing",
                notifications: "Notifications",
                fetching: "Preparing Feed...",
                share: "Share",
                openChat: "Open Chat",
                size: "Video Size",
                date: "Upload Date",
                views: "Views"
            },
            bn: {
                save: "ভিডিও সেভ করুন",
                saved: "সেভ করা হয়েছে",
                refresh: "রিফ্রেশ",
                report: "রিপোর্ট করুন",
                no_caption: "কোনো ক্যাপশন দেওয়া হয়নি।",
                loading: "লোডিং হচ্ছে...",
                upload_reels: "রিল আপলোড চালু রাখুন",
                notifications: "বিজ্ঞপ্তি/নোটিফিকেশন",
                fetching: "ফিড প্রস্তুত করা হচ্ছে...",
                share: "শেয়ার",
                openChat: "চ্যাট খুলুন",
                size: "ভিডিও সাইজ",
                date: "আপলোড তারিখ",
                views: "ভিউ"
            }
        };

        function showToast(message) {
            const toast = document.getElementById('custom-toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerHTML = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
            }, 2500);
        }

        function applyOwnProfileChip() {
            document.getElementById('ownAvatarImg').src = currentUser.photo;
            document.getElementById('ownNameText').innerText = currentUser.username;
        }
        window.addEventListener('load', () => { loadOwnProfileFromServer(); });

        function applyStaticStrings() {
            const str = uiStrings[appLang];
            document.getElementById('txt-upload').innerText = str.upload_reels;
            document.getElementById('txt-notify').innerText = str.notifications;
            document.getElementById('openChatLabel').innerText = str.openChat;
            document.getElementById('reportVideoLabel').innerText = str.report;
            document.getElementById('lbl-size').innerText = str.size;
            document.getElementById('lbl-date').innerText = str.date;
            document.getElementById('lbl-views').innerText = str.views;
        }

        async function fetchLanguageAndVideos() {
            try {
                const res = await fetch(`/api/user/lang?userId=${currentUser.id}`);
                const data = await res.json();
                appLang = data.lang || "en";
            } catch (err) {
                console.error("Lang fetch failed", err);
            }
            document.getElementById('loaderText').innerText = uiStrings[appLang].fetching;
            applyOwnProfileChip();
            applyStaticStrings();
            fetchVideos();
        }

        // Caption text (bold / links) coming from the Admin Panel -- this
        // IS the "ad" placement; no separate ad banner is rendered.
        function formatCaption(text) {
            if (!text) return "";
            if (text.includes('<a') || text.includes('<strong') || text.includes('<b>')) {
                return text;
            }

            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            safeText = safeText.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="caption-link" onclick="event.stopPropagation();">${url}</a>`;
            });

            const mentionRegex = /@([a-zA-Z0-9_]{5,32})/g;
            safeText = safeText.replace(mentionRegex, function(mention, username) {
                return `<a href="https://t.me/${username}" target="_blank" class="caption-link" onclick="event.stopPropagation();">${mention}</a>`;
            });

            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            safeText = safeText.replace(/\*(.*?)\*/g, '<strong>$1</strong>');

            return safeText;
        }

        // Feed is loaded 10 videos at a time; the next 10 are fetched
        // automatically once the last loaded video becomes active.
        const PAGE_SIZE = 10;
        let pageOffset = 0;
        let isLoadingMore = false;
        let hasMoreVideos = true;

        function sortBatch(list) {
            list.sort((a, b) => {
                const dateA = a.timestamp ? new Date(a.timestamp) : parseInt(a.id) || 0;
                const dateB = b.timestamp ? new Date(b.timestamp) : parseInt(b.id) || 0;
                return dateB - dateA;
            });
            return list;
        }

        async function fetchVideos() {
            try {
                let seenVideos = JSON.parse(localStorage.getItem('seen_videos') || '[]');
                const response = await fetch('/api/videos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, seenVideos: seenVideos, limit: PAGE_SIZE, offset: 0 })
                });

                const data = await response.json();
                if (data.wasReset) {
                    localStorage.setItem('seen_videos', '[]');
                }

                let batch = sortBatch(data.videos || []);

                const startParam = tg?.initDataUnsafe?.start_param;
                if (startParam) {
                    const matchedIndex = batch.findIndex(v => String(v.id) === String(startParam));
                    if (matchedIndex !== -1) {
                        const matchedVideo = batch.splice(matchedIndex, 1)[0];
                        batch.unshift(matchedVideo);
                    }
                }

                videos = batch;
                pageOffset = batch.length;
                hasMoreVideos = batch.length >= PAGE_SIZE;

                renderVideos();
            } catch (err) {
                console.error("Failed to load videos", err);
                hideLoader();
            }
        }

        async function loadMoreVideos() {
            if (isLoadingMore || !hasMoreVideos) return;
            isLoadingMore = true;
            try {
                let seenVideos = JSON.parse(localStorage.getItem('seen_videos') || '[]');
                const response = await fetch('/api/videos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, seenVideos: seenVideos, limit: PAGE_SIZE, offset: pageOffset })
                });

                const data = await response.json();
                const batch = sortBatch(data.videos || []);

                if (batch.length < PAGE_SIZE) hasMoreVideos = false;
                pageOffset += batch.length;

                if (batch.length > 0) {
                    appendMoreVideos(batch);
                }
            } catch (err) {
                console.error("Failed to load more videos", err);
            } finally {
                isLoadingMore = false;
            }
        }

        function buildReelHtml(video, index) {
            const str = uiStrings[appLang];
            const streamUrl = `/api/video/stream/${encodeURIComponent(video.fileId)}`;
            const isLiked = localStorage.getItem(`liked_${video.id}`) === 'true';
            const uploaderName = video.uploaderName || "@reelsuploder";
            const uploaderPic = resolvePhotoUrl(video.uploaderPic);

            const verified = isVerifiedAccount(uploaderName, video.uploaderId);
            const badgeInline = verified ? `<span class="inline-verified-badge">${verifiedBadgeSvg()}</span>` : '';

            return `
                <div class="reel" id="reel-${video.id}" data-index="${index}">
                    <div class="vignette-overlay"></div>
                    <div class="loading">${str.loading}</div>

                    <div class="play-indicator">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="#fff">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>

                    <video data-src="${streamUrl}" loop playsinline webkit-playsinline preload="none" onloadedmetadata="videoLoaded(this)" onclick="togglePlay(this)" onended="markAsWatched('${video.id}')"></video>

                    <div class="heart-pop" id="heart-pop-${video.id}">
                        <svg viewBox="0 0 24 24" width="90" height="90" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>

                    <div class="reel-progress"><i></i></div>

                    <div class="overlay">
                        <!-- Left Info Panel: dynamic uploader info + admin-panel caption/ad text -->
                        <div class="video-details">
                            <div class="uploader-info" onclick="handleUploaderClick('${video.uploaderId}', '${uploaderName}', '${uploaderPic}', '${video.formattedSize || "Unknown Size"}', '${video.formattedDate || "Unknown Date"}', '${video.views || 0}', '${video.id}')">
                                <img src="${uploaderPic}" alt="${uploaderName}" onerror="handleImgError(this)">
                                <h3>${uploaderName}</h3>
                                ${badgeInline}
                            </div>
                            <p><strong>Ads |</strong> ${formatCaption(video.caption) || str.no_caption}</p>
                        </div>

                        <div class="actions-panel">
                            <button class="action-button ${isLiked ? 'liked' : ''}" aria-label="Like" onclick="toggleLike('${video.id}', event)">
                                <div class="action-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                    </svg>
                                </div>
                                <span id="like-count-${video.id}">${video.likes || 0}</span>
                            </button>

                            <button class="action-button" onclick="shareVideo('${video.id}', event)">
                                <div class="action-icon accent">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
                                    </svg>
                                </div>
                                <span class="action-label-accent">${str.share}</span>
                            </button>

                            <button class="action-button refresh" onclick="refreshFeed(event)">
                                <div class="action-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
                                    </svg>
                                </div>
                                <span>${str.refresh}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderVideos() {
            if (videos.length === 0) {
                container.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100%;">No videos available.</div>`;
                hideLoader();
                return;
            }

            container.innerHTML = videos.map((video, index) => buildReelHtml(video, index)).join('');

            updateVideoSources(0);
            const allReels = document.querySelectorAll('.reel');
            setupIntersectionObserver(allReels);
            setupDoubleTap(allReels);
            setupPinchZoom(allReels);
        }

        // Append the next page of videos without disturbing the reel that
        // is currently playing.
        function appendMoreVideos(newVideos) {
            const startIndex = videos.length;
            videos = videos.concat(newVideos);

            const html = newVideos.map((video, i) => buildReelHtml(video, startIndex + i)).join('');
            container.insertAdjacentHTML('beforeend', html);

            const newReelEls = newVideos
                .map(v => document.getElementById(`reel-${v.id}`))
                .filter(Boolean);

            setupIntersectionObserver(newReelEls);
            setupDoubleTap(newReelEls);
            setupPinchZoom(newReelEls);
        }

        // Optimized Autoplay sound workaround on user touch
        function forceUnmuteActiveVideo() {
            const currentVideo = document.querySelector(`.reel[data-index="${activeIndex}"] video`);
            if (currentVideo && currentVideo.muted) {
                currentVideo.muted = false;
            }
        }
        document.addEventListener('touchstart', forceUnmuteActiveVideo, { once: true });
        document.addEventListener('click', forceUnmuteActiveVideo, { once: true });

        function updateVideoSources(currentIndex) {
            const reels = document.querySelectorAll('.reel');
            reels.forEach((reel, i) => {
                const video = reel.querySelector('video');
                if (!video) return;
                const realSrc = video.getAttribute('data-src');

                if (i >= currentIndex - 1 && i <= currentIndex + 1) {
                    if (!video.src || video.src === "" || !video.src.includes(realSrc)) {
                        video.src = realSrc;
                        video.load();
                    }
                } else {
                    if (video.src && video.src !== "") {
                        video.pause();
                        video.removeAttribute('src');
                        video.load();
                        video.classList.remove('loaded');
                        video.style.transform = 'scale(1)';
                        video.dataset.scale = 1;
                        const loadingText = reel.querySelector('.loading');
                        if (loadingText) loadingText.style.display = 'block';
                    }
                }
            });
        }

        function videoLoaded(videoElement) {
            videoElement.classList.add('loaded');
            const loadingText = videoElement.parentElement.querySelector('.loading');
            if (loadingText) loadingText.style.display = 'none';

            const reelParent = videoElement.closest('.reel');
            if (reelParent && parseInt(reelParent.getAttribute('data-index')) === activeIndex) {
                hideLoader();
                // Ensure instant smooth autoplay with sound fallback
                videoElement.muted = false;
                videoElement.play().catch(() => {
                    videoElement.muted = true;
                    videoElement.play().catch(() => {});
                });
            }
        }

        function hideLoader() {
            const loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
            }
        }

        function togglePlay(video) {
            video.muted = false; // Unmute on explicit user interaction
            const playIndicator = video.parentElement.querySelector('.play-indicator');
            if (video.paused) {
                video.play().then(() => {
                    if (playIndicator) playIndicator.classList.remove('show');
                }).catch(() => {});
            } else {
                video.pause();
                if (playIndicator) {
                    playIndicator.classList.add('show');
                }
            }
        }

        async function toggleLike(videoId, event) {
            if (event) event.stopPropagation();
            const likeBtn = document.querySelector(`#reel-${videoId} .action-button`);
            const likeCountSpan = document.getElementById(`like-count-${videoId}`);
            const isLiked = likeBtn.classList.contains('liked');
            let currentLikes = parseInt(likeCountSpan.innerText);

            const newLikedState = !isLiked;
            if (newLikedState) {
                likeBtn.classList.add('liked');
                likeCountSpan.innerText = currentLikes + 1;
                localStorage.setItem(`liked_${videoId}`, 'true');
            } else {
                likeBtn.classList.remove('liked');
                likeCountSpan.innerText = Math.max(0, currentLikes - 1);
                localStorage.removeItem(`liked_${videoId}`);
            }

            try {
                await fetch('/api/video/like', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ videoId, isLiked: newLikedState, userId: currentUser.id, username: currentUser.username })
                });
            } catch (err) { console.error(err); }
        }

        // Save lives inside the uploader/video-info popup
        function refreshSaveButtonUI(videoId) {
            const str = uiStrings[appLang];
            const isSaved = localStorage.getItem(`saved_${videoId}`) === 'true';
            const saveBtn = document.getElementById('btnSaveVideoInSheet');
            const saveLabel = document.getElementById('saveVideoLabel');
            if (!saveBtn) return;
            saveBtn.classList.toggle('active', isSaved);
            saveLabel.innerText = isSaved ? str.saved : str.save;
        }

        async function toggleSave(videoId) {
            const isSaved = localStorage.getItem(`saved_${videoId}`) === 'true';
            const newSavedState = !isSaved;

            if (newSavedState) {
                localStorage.setItem(`saved_${videoId}`, 'true');
            } else {
                localStorage.removeItem(`saved_${videoId}`);
            }

            refreshSaveButtonUI(videoId);
            showToast(newSavedState ? "Video saved" : "Removed from saved");

            try {
                await fetch('/api/video/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ videoId, userId: currentUser.id, isSaved: newSavedState })
                });
            } catch (err) { console.error(err); }
        }

        function shareVideo(videoId, event) {
            if (event) event.stopPropagation();

            const shareUrl = `https://t.me/SnapSavingBot/reels?startapp=${videoId}`;

            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast("Link copied. Opening Telegram...");
                setTimeout(() => {
                    const tgText = encodeURIComponent("Check out this Reel!");
                    const tgShareLink = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${tgText}`;
                    if (tg) {
                        tg.openTelegramLink(tgShareLink);
                    } else {
                        window.open(tgShareLink, '_blank');
                    }
                }, 800);
            }).catch(() => {
                const tgText = encodeURIComponent("Check out this Reel!");
                const tgShareLink = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${tgText}`;
                if (tg) {
                    tg.openTelegramLink(tgShareLink);
                } else {
                    window.open(tgShareLink, '_blank');
                }
            });
        }

        function handleUploaderClick(uploaderId, uploaderName, uploaderPic, size, date, views, videoId) {
            const official = isOfficialAccount(uploaderName, uploaderId);
            const verified = isVerifiedAccount(uploaderName, uploaderId);

            // Open bottom-sheet details popup
            document.getElementById('upModalPic').src = uploaderPic;
            document.getElementById('upModalName').innerText = uploaderName;
            document.getElementById('upModalSize').innerText = size || "Unknown Size";
            document.getElementById('upModalDate').innerText = date || "Unknown Date";
            document.getElementById('upModalViews').innerText = views || "0";

            document.getElementById('upModalVerified').style.display = verified ? 'flex' : 'none';

            const btnOpenProfile = document.getElementById('btnOpenTgProfile');
            if (official) {
                btnOpenProfile.style.display = 'none'; // The official reels channel has no personal chat
            } else {
                btnOpenProfile.style.display = 'flex';
                btnOpenProfile.onclick = function() {
                    const cleanUsername = uploaderName.replace('@', '');
                    const profileLink = `https://t.me/${cleanUsername}`;
                    if (tg) {
                        tg.openTelegramLink(profileLink);
                    } else {
                        window.open(profileLink, '_blank');
                    }
                };
            }

            // Wire up Save Video button for this specific video
            const btnSave = document.getElementById('btnSaveVideoInSheet');
            btnSave.onclick = function() { toggleSave(videoId); };
            refreshSaveButtonUI(videoId);

            // Wire up Report Video button
            const btnReport = document.getElementById('btnReportVideoInSheet');
            btnReport.onclick = function() {
                closeUploaderSheet();
                reportVideo(videoId);
            };

            document.getElementById('uploaderSheet').classList.add('open');
        }

        function closeUploaderSheet() {
            document.getElementById('uploaderSheet').classList.remove('open');
        }

        async function reportVideo(videoId) {
            const confirmMsg = appLang === "bn" ? "রিপোর্ট করতে চান?" : "Do you want to report this?";
            if (!confirm(confirmMsg)) return;

            try {
                await fetch('/api/video/report', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ videoId, userId: currentUser.id, username: currentUser.username })
                });
                showToast(appLang === "bn" ? "রিপোর্ট সফল হয়েছে" : "Reported successfully");
            } catch (err) { console.error(err); }
        }

        function markAsWatched(videoId) {
            let seenVideos = JSON.parse(localStorage.getItem('seen_videos') || '[]');
            if (!seenVideos.includes(videoId)) {
                seenVideos.push(videoId);
                localStorage.setItem('seen_videos', JSON.stringify(seenVideos));
            }
        }

        async function trackView(videoId) {
            try {
                await fetch('/api/video/view', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ videoId, userId: currentUser.id })
                });
            } catch (err) { console.error(err); }
        }

        function refreshFeed(event) {
            if (event) event.stopPropagation();
            const loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.visibility = 'visible';
                loader.style.opacity = '1';
            }
            fetchVideos();
        }

        let reelObserver = null;

        function setupIntersectionObserver(reelEls) {
            const targets = reelEls || document.querySelectorAll('.reel');
            if (!reelObserver) {
                const observerOptions = { root: container, threshold: 0.6 };
                reelObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const video = entry.target.querySelector('video');
                        const videoId = entry.target.id.replace('reel-', '');
                        const index = parseInt(entry.target.getAttribute('data-index'));
                        const playIndicator = entry.target.querySelector('.play-indicator');

                        if (video) {
                            if (entry.isIntersecting) {
                                activeIndex = index;
                                updateVideoSources(activeIndex);
                                if (playIndicator) playIndicator.classList.remove('show');

                                // Explicit play unmuted on swipe/intersection
                                video.muted = false;
                                video.play().then(() => trackView(videoId)).catch(() => {
                                    video.muted = true;
                                    video.play().catch(() => {});
                                });

                                // Reached the last loaded video -- fetch the next 10
                                if (index >= videos.length - 1) {
                                    loadMoreVideos();
                                }
                            } else {
                                video.pause();
                                if (playIndicator) playIndicator.classList.remove('show');
                            }
                        }
                    });
                }, observerOptions);
            }
            targets.forEach(reel => reelObserver.observe(reel));
        }

        function setupDoubleTap(reelEls) {
            const targets = reelEls || document.querySelectorAll('.reel');
            targets.forEach(reel => {
                let lastTap = 0;
                reel.addEventListener('click', function(e) {
                    if (e.target.classList.contains('caption-link') || e.target.closest('.uploader-info')) return;

                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        const videoId = reel.id.replace('reel-', '');
                        const heartPop = document.getElementById(`heart-pop-${videoId}`);
                        heartPop.classList.add('pop-active');
                        setTimeout(() => heartPop.classList.remove('pop-active'), 800);
                        const likeBtn = reel.querySelector('.action-button');
                        if (!likeBtn.classList.contains('liked')) toggleLike(videoId);
                    }
                    lastTap = currentTime;
                });
            });
        }

        // Two-finger pinch to zoom in / out on the active video
        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function setupPinchZoom(reelEls) {
            const targets = reelEls
                ? Array.from(reelEls).map(reel => reel.querySelector('video')).filter(Boolean)
                : document.querySelectorAll('.reel video');

            targets.forEach(video => {
                let initialDistance = null;
                let baseScale = parseFloat(video.dataset.scale) || 1;

                video.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 2) {
                        initialDistance = getTouchDistance(e.touches);
                        baseScale = parseFloat(video.dataset.scale) || 1;
                    }
                }, { passive: true });

                video.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 2 && initialDistance) {
                        e.preventDefault();
                        const newDistance = getTouchDistance(e.touches);
                        let scale = baseScale * (newDistance / initialDistance);
                        scale = Math.min(Math.max(scale, 1), 3);
                        video.style.transform = `scale(${scale})`;
                        video.dataset.scale = scale;
                    }
                }, { passive: false });

                video.addEventListener('touchend', function(e) {
                    if (e.touches.length < 2) {
                        initialDistance = null;
                    }
                }, { passive: true });
            });
        }

        let activeProfileUserId = null;
        async function openProfileModal(uploaderId, uploaderName, uploaderPic) {
            activeProfileUserId = uploaderId;
            document.getElementById('modalProfileName').innerText = uploaderName;
            document.getElementById('modalProfilePic').src = uploaderPic;

            let uploadingVal = true;
            let notificationVal = true;

            // Load from local storage directly first for instantaneous UI state
            const localUpload = localStorage.getItem(`setting_upload_${uploaderId}`);
            const localNotify = localStorage.getItem(`setting_notify_${uploaderId}`);

            if (localUpload !== null) uploadingVal = localUpload === 'true';
            if (localNotify !== null) notificationVal = localNotify === 'true';

            try {
                const res = await fetch(`/api/user/settings?userId=${uploaderId}`);
                if (res.ok) {
                    const settings = await res.json();
                    uploadingVal = settings.uploadingReels !== false;
                    notificationVal = settings.notifications !== false;

                    localStorage.setItem(`setting_upload_${uploaderId}`, uploadingVal ? 'true' : 'false');
                    localStorage.setItem(`setting_notify_${uploaderId}`, notificationVal ? 'true' : 'false');
                }
            } catch (err) {
                console.log("Failed to sync modal settings with server, using local fallback");
            }

            document.getElementById('uploadToggle').checked = uploadingVal;
            document.getElementById('notificationToggle').checked = notificationVal;

            if (uploaderId !== currentUser.id) {
                document.getElementById('uploadToggle').disabled = true;
                document.getElementById('notificationToggle').disabled = true;
            } else {
                document.getElementById('uploadToggle').disabled = false;
                document.getElementById('notificationToggle').disabled = false;
            }
            document.getElementById('profileModal').classList.add('open');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('open');
        }

        async function updateProfileSetting() {
            if (activeProfileUserId !== currentUser.id) return;
            const uploadingVal = document.getElementById('uploadToggle').checked;
            const notificationVal = document.getElementById('notificationToggle').checked;

            localStorage.setItem(`setting_upload_${currentUser.id}`, uploadingVal ? 'true' : 'false');
            localStorage.setItem(`setting_notify_${currentUser.id}`, notificationVal ? 'true' : 'false');

            try {
                await fetch('/api/user/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        userId: currentUser.id,
                        uploadingReels: uploadingVal,
                        notifications: notificationVal
                    })
                });
                showToast("Preferences updated successfully");
            } catch (err) {
                console.error("Failed to sync settings", err);
            }
        }

        applyOwnProfileChip();
        fetchLanguageAndVideos();

        /* ============ Motion polish: progress line + swipe-down sheets ============ */
        // Thin progress line at the bottom of each reel (transform only, no layout).
        document.getElementById('reelsContainer').addEventListener('timeupdate', (e) => {
            const v = e.target;
            if (!v || v.tagName !== 'VIDEO' || !v.duration) return;
            const bar = v.parentElement.querySelector('.reel-progress i');
            if (bar) bar.style.transform = `scaleX(${Math.min(v.currentTime / v.duration, 1)})`;
        }, true);

        // Drag a bottom sheet down by its handle to dismiss it.
        (function enableSheetDrag() {
            document.querySelectorAll('.bottom-sheet').forEach(sheet => {
                const content = sheet.querySelector('.sheet-content');
                const header = sheet.querySelector('.sheet-header');
                if (!content || !header) return;
                let startY = 0, delta = 0, dragging = false;
                header.addEventListener('touchstart', (e) => {
                    dragging = true; startY = e.touches[0].clientY; delta = 0;
                    content.classList.add('dragging');
                }, { passive: true });
                header.addEventListener('touchmove', (e) => {
                    if (!dragging) return;
                    delta = Math.max(0, e.touches[0].clientY - startY);
                    content.style.transform = `translateY(${delta}px)`;
                }, { passive: true });
                const end = () => {
                    if (!dragging) return;
                    dragging = false;
                    content.classList.remove('dragging');
                    content.style.transform = '';
                    if (delta > 90) {
                        if (sheet.id === 'uploaderSheet') closeUploaderSheet();
                        else closeProfileModal();
                    }
                };
                header.addEventListener('touchend', end);
                header.addEventListener('touchcancel', end);
            });
        })();
    </script>
